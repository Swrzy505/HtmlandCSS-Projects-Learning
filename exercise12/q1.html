<!DOCTYPE html>
<html>

  <title>Flex</title>
  </head>
  <body>
    <div style="display: flex;margin-bottom: 30px;">
   <div style="width: 200px;background-color: pink;">200px</div>
   <div style="width: 75px;background-color: aqua;">75px</div>
   </div>
    <div style="display: flex;margin-bottom: 30px;
    ">
   <div style="width: 50px;background-color: pink;">item1</div>
   <div style="width: 50px;background-color: aqua;flex: 1;">item2</div>
   <div style="width: 50px;background-color: pink;">item3</div>
   </div>
    <div style="display: flex;justify-content: space-between;
    ">
   <div style="background-color: pink;">item1</div>
   <div style="background-color: aqua;;">item2</div>
   <div style="background-color: pink;">item3</div>
   <div style="background-color: rgb(130, 1, 23);">item4</div>
   </div>
   <div style="display: flex;margin-top:30px; justify-content: space-between; border:1px solid gray;height: 40px;align-items: center;">
   <div style="width: 50px;background-color: pink;">item1</div>
   <div style="width: 50px;background-color: aqua;">item2</div>
   </div>
   
  </body>
</html>
