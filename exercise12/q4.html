<!DOCTYPE html>
<html>
  <head>
   <title>Nav Bar</title>
   <style>
    .container{
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      padding: 10px;
      background-color:burlywood;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
     
    }
    .left{
     padding: 10px;
     color: white;
     font-weight: bold;
    }
    .s{
      width: 500px;
      padding: 10px;
      padding-left: 20px;
      border-radius: 50px;
      border: none;
    }

    .btn{
      padding-left:20px ;
      padding-bottom:10px ;
      padding-right:20px ;
      padding-top: 10px;
      background-color: burlywood;
      border: 1px solid white;
      color: white;
    }
   </style>
  </head>
  <body>
  <div class="container">
    <div class="left">Home</div>
    <div class="middle"><input class="s" type="text" placeholder="Search"></div>
    <div class="right"><button class="btn">Download</button></div>
  </div>
  </body>
</html>
