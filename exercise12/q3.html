<!DOCTYPE html>
<head>
  <title>cat profiles</title>
  <style>
  p{
    margin-top: 0px;
    margin-bottom: 0px;
    font-family: Arial, Helvetica, sans-serif;
  }
  .container{
    width: 250px;
    display: flex;
    flex-direction: row;
    align-items: center;
    margin-bottom: 20px;
    
  }
  img{
  height: 50px;
  width: 50px;
  object-fit: cover;
  border-radius: 25px;
  margin-right: 15px;
  }
  .Flw-btn{
  background-color: rgb(29, 155, 240);
  color: white;
  border: none;
 padding: 10px;
 border-radius: 10px;
 cursor: pointer;


  }
  .name{
     font-weight: bold;
  margin-bottom: 3px;
  }
  .val{
  color: rgb(150, 150, 150);
  margin-bottom: 5px;
  }
  .pop{
  color: rgb(150, 150, 150);
  font-size: 14px;
  }
  .details-cat{
    width: 200px;
  }


  </style>
</head>
<body>
  <div class="container">
    
    <img src="images/cat.jpg">

    <div class="details-cat">
    <p class="name">Oliver</p>
    <p class="val">the cat</p>
    <p class="pop">popular</p>
    </div>

    <button class="Flw-btn">Follow</button>

  </div>
   <div class="container">
    
    <img src="images/cat2.jpg">

    <div class="details-cat">
    <p class="name">Mimi</p>
    <p class="val">the cat</p>
    <p class="pop">popular</p>
    </div>

    <button class="Flw-btn">Follow</button>

  </div>
   <div class="container">
    
    <img src="images/dog.jpg">

    <div class="details-cat">
    <p class="name">Rex</p>
    <p class="val">the dog</p>
    <p class="pop">popular</p>
    </div>

    <button class="Flw-btn">Follow</button>

  </div>
  
</body>
</html>
