<!DOCTYPE html>
<html>
  <head>
   <title>discord</title>
   <style>
    .main{
      display: flex;
    }
    img{
      height: 32px;
      width: 32px;
      border-radius: 16px;
      object-fit: cover;
      margin-left: 6px;
      margin-top: 2px;
    }
    .left{
      background-color: rgb(47, 47, 47);
      position: fixed;
      top: 0px;
      left: 0px;
      bottom: 0px;
      width: 45px;
      

    }
    .left-left{
      position: fixed;
      top: 0px;
      left: 45px;
      background-color: rgb(63, 62, 62);
      bottom: 0px;
      width: 120px;
      padding: 10px;

    }
    p{
      margin-top: 0px;
      margin-bottom: 0px;
      font-family: Arial, Helvetica, sans-serif;
      
      
    }
    .img1{
      margin-top: 9px;
    }
    .info{
      display: flex;
      justify-content: space-between;
      color: white;
      align-items: center;
    
    }
    .add{
      color: rgb(150, 150, 150);
    }
    .info1{
      font-size: 10px;
      font-weight: bold;
      
    }
    .other{
      font-size: 12px;
      color: gray;
      
    }
    .u,.n,.f{
      margin-bottom: 10px;
    }
    
   </style>
  </head>
  <body>
    <div class="main">
        <div class="left">
          <div class="img1"><img src="images/cat.jpg"> </div>
          <div><img src="images/cat2.jpg"> </div>
          <div><img src="images/dog.jpg"> </div>
        </div>
        <div class="left-left">
          <div class="info">
            <p class="info1">INFO</p>
            <p class="add">+</p>
          </div>
          <div class="other">
          <p class="n"># new-videos</p>
          <p class="u"># updates</p>
          <p class="f"># faq</p>
          </div>
        </div>
    </div>
  </body>
</html>
