<!DOCTYPE html>
<html>
  <head>
  <title>Css Position</title>
  <style>
    button{
      font-size: 10px;
      font-weight: bold;
      font-family: Arial, Helvetica, sans-serif;
      color: white;

    }

    body{
      height: 3000px;
    }
    .bottom-right{
      position: fixed;
      background-color: white;
      color: white;
      top: 0px;
      left: 0px;
      right: 0px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgb(187, 186, 186);

    }
    img{
     height: 24px;
     width: 24px;
     border-radius: 12px;
     margin-top: 4px;
     object-fit: cover;
    }
    .img1{

    }
    .name1{
      margin-left: 7px;
      color: black;
      font-weight: 700;
      font-size: 12px;
      font-family: Arial, Helvetica, sans-serif;
      
    }
    .button1{
     margin-right: 5px;
     border: none;
     padding-top: 4px;
     padding-bottom: 4px;
     background-color: rgb(0, 118, 186);
     padding-left: 7px;
     padding-right: 7px;
     border-radius: 4px;
     
    }
    .button2{
     border: none;
     padding: 3px;
     border-radius: 4px;
     padding-left: 10px;
     padding-right: 10px;
     padding-top: 4px;
     padding-bottom: 4px;
     color: black;
    }
    p{
      margin-top: 0px;
      margin-bottom: 0px;
    }
    .left-side{
     display: flex;
     align-items: center;
     margin-left: 40px;
     

    }
    .right-side{
     display: flex;
     margin-right: 40px;
    }
  </style>
  </head>
  <body>
    <div class="bottom-right"> 
      <div class="left-side">
     <div class="img1">
       <img src="images/cat.jpg">
     </div>  
     <div>
       <p class="name1">Oliver cat</p>
     </div>
     </div>
     <div class="right-side">
     <div >
       <button class="button1">Add Friend</button>
     </div >
     <div >
      <button class="button2">Message</button>
     </div>
    </div>
    </div>
  </body>
</html>
